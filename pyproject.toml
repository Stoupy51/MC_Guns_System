
[project]
name = "template"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
	"smithed",
	"stewbeet>=3.9.0",
]

# This project is a datapack, not a Python package: uv only has to manage its dependencies.
[tool.uv]
package = false

# The smithed release on PyPI mixes Pydantic V1 and V2 models, which makes Smithed Weld merging
# fail on recent Python. Remove this section and the "smithed" dependency above once it is fixed upstream.
[tool.uv.sources]
smithed = { git = "https://github.com/Stoupy51/smithed-python.git" }

[dependency-groups]
dev = [
    "pyright",
    "ruff",
    "uv",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.complexipy]
paths = ["."]
max-complexity-allowed = 15
sort = "desc"

[tool.ruff]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "*.pyi",
]
line-length = 135

[tool.ruff.lint.isort]
# Keeps the "name as name" re-exports of a package grouped in a single statement
combine-as-imports = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "T20",
    "RUF",
]
ignore = [
    "T201",
    "W191",
    "N803",
    "N806",
]

